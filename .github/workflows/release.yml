name: Build and Release

on:
  push:
    # Trigger on Major and Minor version tags (e.g., v0.1.0, v0.2.0, v1.0.0, v2.3.0)
    # Patch releases (e.g., v0.1.1, v1.0.4) will NOT trigger a release build
    tags:
      - 'v*.*.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-pc-windows-msvc
            arch_name: arm64
            exe_name: Rust-Expander-ARM64.exe
          - target: x86_64-pc-windows-msvc
            arch_name: x64
            exe_name: Rust-Expander-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package zip archive
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}" -match '^v') { "${{ github.ref_name }}" } else { "latest" }
          $zipName = "rust-expander-${version}-${{ matrix.arch_name }}.zip"
          
          # Create staging folder
          $stageDir = "dist_${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          
          # Copy binary, README, and LICENSE
          Copy-Item "target/${{ matrix.target }}/release/rust-expander.exe" -Destination "$stageDir\${{ matrix.exe_name }}"
          Copy-Item "README.md" -Destination "$stageDir\README.md"
          Copy-Item "LICENSE" -Destination "$stageDir\LICENSE"
          
          # Also copy standalone exe for direct download
          Copy-Item "target/${{ matrix.target }}/release/rust-expander.exe" -Destination "${{ matrix.exe_name }}"
          
          # Compress to zip
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName and ${{ matrix.exe_name }}"

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch_name }}
          path: |
            *.zip
            *.exe

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum *.zip *.exe > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.zip
            release_assets/*.exe
            release_assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
